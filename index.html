<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Night · Gestão</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#1f2126;--hd:#26282c;--card:#2b2e36;--bd:#3c404b;--tx:#eef1f6;--mu:#9aa3b5;--ac:#4cb6f5;--au:#f7c948;--ok:#4ade80;--er:#f87171;--wa:#fb923c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--hd);border-bottom:2px solid var(--au);display:flex;align-items:center;gap:8px;padding:6px 14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}header img{height:48px;max-width:180px;object-fit:contain}
nav{display:flex;gap:5px;flex:1;align-items:center;flex-wrap:wrap}.w{max-width:1180px;margin:0 auto;padding:16px}
button{font:inherit;cursor:pointer;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 12px}button:hover{border-color:var(--ac)}
button.on{border-color:var(--au);color:var(--au)}button.p{background:var(--ac);border-color:var(--ac);color:#06202e;font-weight:700}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}textarea{min-height:70px;resize:vertical}
label{display:block;font-size:.78rem;color:var(--mu);margin:8px 0 3px}h2{margin:4px 0 14px}h3{margin:18px 0 8px;color:var(--au)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 10px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input{flex:1;min-width:170px}.bar select{width:auto}.t{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:11px;margin-bottom:9px}.t.ok{border-left-color:var(--ok)}.t.er{border-left-color:var(--er)}.t.wa{border-left-color:var(--wa)}
.h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.mu{color:var(--mu);font-size:.84rem}.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;align-items:center}.acts select{width:auto}.tag{font-size:.72rem;border:1px solid var(--au);color:var(--au);border-radius:99px;padding:1px 8px;margin-right:5px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px;margin-bottom:12px}.kp div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}.kp b{display:block;font-size:1.2rem}
.r{display:grid;grid-template-columns:90px 1fr 70px 110px 40px;gap:6px;margin-bottom:6px}.tbl{overflow:auto}.tbl table{min-width:720px}
table{border-collapse:collapse;width:100%}td,th{padding:7px 6px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-size:.8rem}
#lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}#lg>div{background:var(--hd);border:1px solid var(--bd);border-top:3px solid var(--au);border-radius:12px;padding:22px;width:100%;max-width:360px;text-align:center}#lg img{width:100%;max-width:280px}
#mod{display:none;position:fixed;inset:0;background:#000a;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:20}.box{background:var(--hd);border:1px solid var(--bd);border-radius:12px;padding:16px;width:100%;max-width:820px}.box h3{margin-top:0}
.small{font-size:.78rem}.danger{color:var(--er)}.success{color:var(--ok)}.muted{opacity:.7}.right{text-align:right}.empty{padding:25px;text-align:center;color:var(--mu)}
#print{display:none}@media print{body{background:#fff!important}#app,#lg,#mod{display:none!important}#print{display:block;color:#000;font:13px/1.4 Arial,sans-serif}#print .ph{display:flex;align-items:center;gap:14px;background:#26282c;color:#fff;padding:10px;border-bottom:4px solid #f7c948}#print img{height:70px}#print h1{margin:0}#print td,#print th{border-bottom:1px solid #ccc}#print ol{font-size:11px}}
@media(max-width:700px){.g2,.g3{grid-template-columns:1fr}.r{grid-template-columns:75px 1fr 55px 90px 36px}header img{height:40px}}
</style>
</head>
<body>
<div id="lg"><div>
<img src="logo.png" alt="Tech Night">
<label>E-mail</label><input id="le" type="email" autocomplete="username">
<label>Senha</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()">
<p id="lerr" style="color:var(--er);min-height:1.2em;margin:8px 0"></p>
<button class="p" style="width:100%" onclick="login()">Entrar</button>
</div></div>
<div id="app" style="display:none"><header><img src="logo.png" alt="Tech Night"><nav id="nav"></nav></header><div class="w" id="main"></div></div>
<div id="mod"></div><div id="print"></div>

<script>
const SB_URL='https://towakjhmchmuopvypcuo.supabase.co',SB_KEY='sb_publishable_sqPYwv0jFUcel0Y9kgqlOQ_pz54rF3D';
const db=supabase.createClient(SB_URL,SB_KEY);
const $=i=>document.getElementById(i),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R$=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const D=d=>d?new Date(String(d).length<=10?d+'T12:00:00':d).toLocaleDateString('pt-BR'):'';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const opts=(a,s)=>a.map(x=>`<option value="${E(x)}" ${x==s?'selected':''}>${E(x)}</option>`).join('');
const ST=['Aberto','Em andamento','Aguardando peça','Aguardando aprovação do orçamento','Concluído','Entregue'];
const FP=['Pix','Dinheiro','Cartão','Transferência'];
const MODS={dashboard:'Início',chamados:'Chamados',orcamentos:'Orçamentos',clientes:'Clientes',produtos:'Produtos',servicos:'Serviços',estoque:'Estoque',compras:'Compras',fornecedores:'Fornecedores',financeiro:'Financeiro',recibos:'Recibos',admin:'Administração'};
const TABLES=['clientes','tecnicos','os','fin','perfis','produtos','servicos','fornecedores','compras','compra_itens','mov_estoque','orcamentos','orcamento_itens','recibos','empresa'];
let me,S={cli:[],tec:[],os:[],fin:[],per:[],prod:[],serv:[],forn:[],comp:[],ci:[],mov:[],orc:[],oi:[],rec:[],emp:null},tab='dashboard',cur=[],orcCur=[],compCur=[];
let filters={osq:'',osst:'',cq:'',pq:'',sq:'',fq:'',oq:'',fm:'',ft:'R',estq:''};

const can=(m,n)=>me&&(me.admin||me.perms?.[m]?.[n]);
const tot=o=>(o.itens||[]).reduce((s,i)=>s+(+i.q||0)*(+i.v||0),0);
const cn=id=>S.cli.find(c=>c.id==id)?.nome||'—',tn=id=>S.tec.find(t=>t.id==id)?.nome||'—';
const pn=id=>S.prod.find(p=>p.id==id)?.nome||'—',sn=id=>S.serv.find(p=>p.id==id)?.nome||'—';
const fn=id=>S.forn.find(p=>p.id==id)?.nome||'—';
const M=h=>{$('mod').innerHTML=`<div class="box">${h}</div>`;$('mod').style.display='flex'},X=()=>{$('mod').style.display='none'};
async function run(p){const{error}=await p;if(error){alert('Erro: '+error.message);return false}return true}
async function load(){
  const [cli,tec,os,fin,per,prod,serv,forn,comp,ci,mov,orc,oi,rec,emp]=await Promise.all([
    'clientes','tecnicos','os','fin','perfis','produtos','servicos','fornecedores','compras','compra_itens','mov_estoque','orcamentos','orcamento_itens','recibos','empresa'
  ].map(t=>db.from(t).select('*').then(r=>r.data||[])));
  [S.cli,S.tec,S.os,S.fin,S.per,S.prod,S.serv,S.forn,S.comp,S.ci,S.mov,S.orc,S.oi,S.rec,S.emp]=[cli,tec,os,fin,per,prod,serv,forn,comp,ci,mov,orc,oi,rec,emp[0]||null];
}
async function refresh(){await load();draw()}
async function boot(){
  const{data:{session}}=await db.auth.getSession();if(!session)return;
  const{data}=await db.from('perfis').select('*').eq('id',session.user.id).maybeSingle();
  if(!data){$('lerr').textContent='Usuário sem perfil. Fale com o administrador.';await db.auth.signOut();return}
  me=data;$('lg').style.display='none';$('app').style.display='block';await load();
  tab=Object.keys(MODS).find(m=>can(m,'v'))||'dashboard';draw()
}
async function login(){const{error}=await db.auth.signInWithPassword({email:$('le').value.trim(),password:$('lp').value});if(error){$('lerr').textContent='E-mail ou senha inválidos.';return}$('lerr').textContent='';boot()}
async function sair(){await db.auth.signOut();location.reload()}
function draw(){
 $('nav').innerHTML=Object.keys(MODS).filter(m=>m=='dashboard'||can(m,'v')).map(m=>`<button class="${m==tab?'on':''}" onclick="tab='${m}';draw()">${MODS[m]}</button>`).join('')+
 `<span class="mu" style="margin-left:auto">${E(me.nome)}</span><button onclick="sair()">Sair</button>`;
 $('main').innerHTML=V[tab]?V[tab]():'<p class="mu">Módulo não disponível.</p>';
}
const V={
dashboard(){
 const aberto=S.os.filter(o=>!['Concluído','Entregue'].includes(o.status)).length;
 const receber=S.fin.filter(x=>!x.pago&&x.tipo=='R').reduce((a,x)=>a+(+x.valor||0),0);
 const estoque=S.prod.filter(p=>(+p.estoque||0)<=(+p.estoque_min||0)).length;
 const orc=S.orc.filter(o=>o.status=='Enviado').length;
 return `<h2>Visão geral</h2><div class="kp">
 <div><span class="mu">OS em aberto</span><b>${aberto}</b></div><div><span class="mu">A receber</span><b class="success">${R$(receber)}</b></div>
 <div><span class="mu">Orçamentos enviados</span><b>${orc}</b></div><div><span class="mu">Produtos no mínimo</span><b class="${estoque?'danger':''}">${estoque}</b></div></div>
 <div class="g2"><div class="t"><h3>Atalhos</h3><div class="acts">
 ${can('chamados','e')?'<button class="p" onclick="fOSm(0)">Nova OS</button>':''}
 ${can('orcamentos','e')?'<button onclick="fOrc(0)">Novo orçamento</button>':''}
 ${can('clientes','e')?'<button onclick="fCli(0)">Novo cliente</button>':''}
 ${can('produtos','e')?'<button onclick="fProd(0)">Novo produto</button>':''}
 </div></div><div class="t"><h3>Empresa</h3><p class="mu">${S.emp?E(S.emp.nome_fantasia||S.emp.razao_social):'Cadastre os dados da sua empresa em Administração.'}</p></div></div>`;
},
chamados(){
 const l=S.os.filter(o=>(!filters.osst||o.status==filters.osst)&&(!filters.osq||(o.id+' '+cn(o.cliente_id)+' '+o.equip).toLowerCase().includes(filters.osq.toLowerCase()))).sort((a,b)=>b.id-a.id);
 return `<h2>Chamados / Ordens de Serviço</h2><div class="bar"><input placeholder="Buscar nº, cliente ou equipamento" value="${E(filters.osq)}" onchange="filters.osq=this.value;draw()"><select onchange="filters.osst=this.value;draw()"><option value="">Todos os status</option>${opts(ST,filters.osst)}</select>${can('chamados','e')?'<button class="p" onclick="fOSm(0)">Nova OS</button>':''}</div>`+
 (l.map(o=>`<div class="t ${['Concluído','Entregue'].includes(o.status)?'ok':''}"><div class="h"><b>#${o.id} · ${E(cn(o.cliente_id))}</b><span class="mu">${E(o.equip)} · Técnico: ${E(tn(o.tecnico_id))} · ${E(o.origem)}</span></div><div class="mu">${E(o.problema)}</div><div class="acts"><select ${can('chamados','e')?'':'disabled'} onchange="setSt(${o.id},this.value)">${opts(ST,o.status)}</select><b>${R$(tot(o))}</b>${can('chamados','e')?`<button onclick="fOSm(${o.id})">Editar</button>`:''}<button onclick="pdfOS(${o.id})">PDF</button>${can('chamados','x')?`<button onclick="del('os',${o.id})">Excluir</button>`:''}</div></div>`).join('')||'<div class="empty">Nenhuma OS encontrada.</div>')},
clientes(){
 const l=S.cli.filter(c=>!filters.cq||(c.nome+' '+(c.telefone||'')+' '+(c.doc||'')+' '+(c.email||'')).toLowerCase().includes(filters.cq.toLowerCase()));
 return `<h2>Clientes</h2><div class="bar"><input placeholder="Buscar cliente, CPF/CNPJ, telefone..." value="${E(filters.cq)}" onchange="filters.cq=this.value;draw()">${can('clientes','e')?'<button class="p" onclick="fCli(0)">Novo cliente</button>':''}</div>`+
 (l.map(c=>{const uso=+c.credito_utilizado||0,lim=+c.limite_credito||0;return `<div class="t ${c.ativo===false?'muted':''}"><div class="h"><b>${E(c.nome)} ${c.ativo===false?'<span class="tag">Inativo</span>':''}</b><span class="mu">${E(c.telefone)} · ${E(c.email)}</span></div><div class="mu">${c.doc?'CPF/CNPJ: '+E(c.doc)+' · ':''}${c.ie?'IE: '+E(c.ie):''} ${lim?' · Crédito: '+R$(lim)+' | Disponível: '+R$(lim-uso):''}</div><div class="acts"><button onclick="hist(${c.id})">Histórico (${S.os.filter(o=>o.cliente_id==c.id).length})</button>${can('clientes','e')?`<button onclick="fCli(${c.id})">Editar</button>`:''}${can('clientes','x')?`<button onclick="del('clientes',${c.id})">Excluir</button>`:''}</div></div>`}).join('')||'<div class="empty">Nenhum cliente cadastrado.</div>')},
produtos(){
 const l=S.prod.filter(p=>!filters.pq||(p.nome+' '+(p.codigo||'')+' '+(p.categoria||'')).toLowerCase().includes(filters.pq.toLowerCase()));
 return `<h2>Produtos</h2><div class="bar"><input placeholder="Buscar produto, código ou categoria" value="${E(filters.pq)}" onchange="filters.pq=this.value;draw()">${can('produtos','e')?'<button class="p" onclick="fProd(0)">Novo produto</button>':''}</div><div class="tbl"><table><tr><th>Código</th><th>Produto</th><th>Categoria</th><th>Custo</th><th>Venda</th><th>Estoque</th><th>Status</th><th></th></tr>`+
 l.map(p=>`<tr><td>${E(p.codigo)}</td><td>${E(p.nome)}</td><td>${E(p.categoria)}</td><td>${R$(p.custo)}</td><td>${R$(p.preco)}</td><td class="${(+p.estoque||0)<=(+p.estoque_min||0)?'danger':''}">${p.estoque||0}</td><td>${p.ativo===false?'Inativo':'Ativo'}</td><td>${can('produtos','e')?`<button onclick="fProd(${p.id})">Editar</button>`:''}</td></tr>`).join('')+'</table></div>'},
servicos(){
 const l=S.serv.filter(s=>!filters.sq||(s.nome+' '+(s.descricao||'')).toLowerCase().includes(filters.sq.toLowerCase()));
 return `<h2>Serviços</h2><div class="bar"><input placeholder="Buscar serviço" value="${E(filters.sq)}" onchange="filters.sq=this.value;draw()">${can('servicos','e')?'<button class="p" onclick="fServ(0)">Novo serviço</button>':''}</div>`+
 (l.map(s=>`<div class="t ${s.ativo===false?'muted':''}"><div class="h"><b>${E(s.nome)}</b><b>${R$(s.preco)}</b></div><div class="mu">${E(s.descricao)} · ${s.ativo===false?'Inativo':'Ativo'}</div><div class="acts">${can('servicos','e')?`<button onclick="fServ(${s.id})">Editar</button>`:''}</div></div>`).join('')||'<div class="empty">Nenhum serviço cadastrado.</div>')},
estoque(){
 const mov=S.mov.slice().sort((a,b)=>new Date(b.criado)-new Date(a.criado));
 return `<h2>Estoque</h2><div class="kp"><div><span class="mu">Produtos</span><b>${S.prod.length}</b></div><div><span class="mu">Unidades em estoque</span><b>${S.prod.reduce((a,p)=>a+(+p.estoque||0),0)}</b></div><div><span class="mu">Abaixo do mínimo</span><b class="${S.prod.filter(p=>(+p.estoque||0)<=(+p.estoque_min||0)).length?'danger':''}">${S.prod.filter(p=>(+p.estoque||0)<=(+p.estoque_min||0)).length}</b></div></div>
 <div class="bar"><input placeholder="Filtrar movimentações" value="${E(filters.estq)}" onchange="filters.estq=this.value;draw()">${can('estoque','e')?'<button class="p" onclick="fMov()">Ajustar estoque</button>':''}</div>
 <div class="tbl"><table><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Qtd.</th><th>Referência</th><th>Obs.</th></tr>${mov.filter(m=>!filters.estq||(pn(m.produto_id)+' '+m.tipo+' '+(m.obs||'')).toLowerCase().includes(filters.estq.toLowerCase())).map(m=>`<tr><td>${D(m.criado)}</td><td>${E(pn(m.produto_id))}</td><td>${E(m.tipo)}</td><td>${m.quantidade}</td><td>${E(m.referencia)}</td><td>${E(m.obs)}</td></tr>`).join('')||'<tr><td colspan="6">Nenhuma movimentação.</td></tr>'}</table></div>`},
fornecedores(){
 const l=S.forn.filter(f=>!filters.fq||(f.nome+' '+(f.cnpj||'')+' '+(f.telefone||'')).toLowerCase().includes(filters.fq.toLowerCase()));
 return `<h2>Fornecedores</h2><div class="bar"><input placeholder="Buscar fornecedor" value="${E(filters.fq)}" onchange="filters.fq=this.value;draw()">${can('fornecedores','e')?'<button class="p" onclick="fForn(0)">Novo fornecedor</button>':''}</div>`+
 l.map(f=>`<div class="t ${f.ativo===false?'muted':''}"><div class="h"><b>${E(f.nome)}</b><span class="mu">${E(f.telefone)} · ${E(f.email)}</span></div><div class="mu">${E(f.cnpj)} · ${E(f.cidade)}/${E(f.uf)}</div><div class="acts">${can('fornecedores','e')?`<button onclick="fForn(${f.id})">Editar</button>`:''}</div></div>`).join('')||'<div class="empty">Nenhum fornecedor cadastrado.</div>'},
compras(){
 const l=S.comp.slice().sort((a,b)=>b.id-a.id);
 return `<h2>Compras</h2><div class="bar">${can('compras','e')?'<button class="p" onclick="fCompra(0)">Nova compra</button>':''}</div>`+
 l.map(c=>`<div class="t ${c.status=='Recebida'?'ok':''}"><div class="h"><b>Compra #${c.id} · ${E(fn(c.fornecedor_id))}</b><b>${R$(c.total)}</b></div><div class="mu">${D(c.data_compra)} · ${E(c.status)} · ${E(c.observacao)}</div><div class="acts">${can('compras','e')&&c.status!='Recebida'?`<button onclick="receberCompra(${c.id})">Receber e lançar estoque</button>`:''}${can('compras','e')?`<button onclick="fCompra(${c.id})">Editar</button>`:''}</div></div>`).join('')||'<div class="empty">Nenhuma compra cadastrada.</div>'},
orcamentos(){
 const l=S.orc.slice().sort((a,b)=>b.id-a.id);
 return `<h2>Orçamentos</h2><div class="bar"><input placeholder="Buscar orçamento/cliente" value="${E(filters.oq)}" onchange="filters.oq=this.value;draw()">${can('orcamentos','e')?'<button class="p" onclick="fOrc(0)">Novo orçamento</button>':''}</div>`+
 l.filter(o=>!filters.oq||(String(o.id)+' '+cn(o.cliente_id)).toLowerCase().includes(filters.oq.toLowerCase())).map(o=>`<div class="t ${o.status=='Aprovado'?'ok':o.status=='Reprovado'?'er':''}"><div class="h"><b>Orçamento #${o.id} · ${E(cn(o.cliente_id))}</b><b>${R$(o.total)}</b></div><div class="mu">${D(o.data)} · ${E(o.status)} · Validade: ${D(o.validade)}</div><div class="acts"><button onclick="pdfOrc(${o.id})">PDF</button>${can('orcamentos','e')?`<button onclick="fOrc(${o.id})">Editar</button>`:''}${o.status=='Aprovado'&&can('chamados','e')?`<button onclick="orcToOS(${o.id})">Gerar OS</button>`:''}</div></div>`).join('')||'<div class="empty">Nenhum orçamento.</div>'},
financeiro(){
 const F=S.fin,t=today(),mes=filters.fm||t.slice(0,7),sm=a=>a.reduce((s,x)=>s+(+x.valor||0),0),por=x=>!filters.fm||String(x.venc).startsWith(filters.fm);
 const ar=sm(F.filter(x=>!x.pago&&x.tipo=='R'&&por(x))),ap=sm(F.filter(x=>!x.pago&&x.tipo=='P'&&por(x))),jur=sm(F.filter(x=>x.tipo=='R'&&x.pago&&por({venc:x.data_pag})&&+x.juros>0));
 const sal=sm(F.filter(x=>x.pago&&x.tipo=='R'&&(x.data_pag||'').startsWith(mes)))-sm(F.filter(x=>x.pago&&x.tipo=='P'&&(x.data_pag||'').startsWith(mes)));
 return `<h2>Financeiro</h2><div class="kp"><div><span class="mu">A receber</span><b class="success">${R$(ar)}</b></div><div><span class="mu">A pagar</span><b>${R$(ap)}</b></div><div><span class="mu">Juros recebidos</span><b>${R$(jur)}</b></div><div><span class="mu">Saldo do mês</span><b>${R$(sal)}</b></div></div>

async function conc(id){const o=S.os.find(x=>x.id==id),T=tot(o),en=Math.min(Math.max(+$('en').value||0,0),T),rest=+(T-en).toFixed(2),t0=today(),pz=$('pz').value.split('/').map(x=>parseInt(x)).filter(x=>x>=0),b={tipo:'R',os_id:id,cliente_id:o.cliente_id,descr:'OS #'+id},rows=[];if(en>0)rows.push({...b,descr:b.descr+' (entrada)',valor:en,venc:t0,pago:true,data_pag:t0,forma:$('fe').value,juros:0});if(rest>0){const p=pz.length?pz:[0],v=Math.floor(rest/p.length*100)/100;p.forEach((d,i)=>rows.push({...b,parcela:p.length>1?`${i+1}/${p.length}`:null,valor:i==p.length-1?+(rest-v*(p.length-1)).toFixed(2):v,venc:addDays(t0,d),juros:0}))}if(rows.length&&!await run(db.from('fin').insert(rows)))return;if(await run(db.from('os').update({status:'Concluído'}).eq('id',id))){X();refresh()}}

const sumCompra=()=>{if($('cot'))$('cot').textContent='Total: '+R$(compCur.reduce((a,i)=>a+(+i.quantidade||0)*(+i.custo_unitario||0),0))}
async function saveCompra(id){const fornecedor_id=+$('co_f').value;if(!fornecedor_id||!compCur.length)return alert('Informe fornecedor e pelo menos um produto.');const total=compCur.reduce((a,i)=>a+(+i.quantidade||0)*(+i.custo_unitario||0),0);let cid=id;if(id){if(!await run(db.from('compras').update({fornecedor_id,data_compra:$('co_d').value,observacao:$('co_o').value,total}).eq('id',id)))return;await db.from('compra_itens').delete().eq('compra_id',id)}else{const r=await db.from('compras').insert({fornecedor_id,data_compra:$('co_d').value,observacao:$('co_o').value,total,status:'Pendente'}).select().single();if(r.error)return alert('Erro: '+r.error.message);cid=r.data.id}if(compCur.length&&!await run(db.from('compra_itens').insert(compCur.map(i=>({...i,compra_id:cid})))) )return;X();refresh()}
async function receberCompra(id){if(!confirm('Confirmar recebimento? Os produtos serão adicionados ao estoque.'))return;const c=S.comp.find(x=>x.id==id),it=S.ci.filter(i=>i.compra_id==id);for(const i of it){const p=S.prod.find(x=>x.id==i.produto_id);if(p){const novo=(+p.estoque||0)+(+i.quantidade||0);if(!await run(db.from('produtos').update({estoque:novo,custo:+i.custo_unitario||p.custo}).eq('id',p.id)))return;await db.from('mov_estoque').insert({produto_id:p.id,tipo:'Entrada',quantidade:i.quantidade,referencia:'Compra #'+id,obs:'Entrada de compra'})}}if(await run(db.from('compras').update({status:'Recebida'}).eq('id',id)))refresh()}

/* orçamento */
function fOrc(id){const o=S.orc.find(x=>x.id==id)||{data:today(),validade:addDays(today(),7),status:'Rascunho'};orcCur=S.oi.filter(i=>i.orcamento_id==id).map(i=>({...i}));M(`<h3>${id?'Orçamento #'+id:'Novo orçamento'}</h3><div class="g"><div><label>Cliente *</label><select id="or_c"><option value="">Escolher…</option>${S.cli.map(c=>`<option value="${c.id}" ${c.id==o.cliente_id?'selected':''}>${E(c.nome)}</option>`).join('')}</select></div><div><label>Data</label><input id="or_d" type="date" value="${o.data||today()}"></div><div><label>Validade</label><input id="or_vd" type="date" value="${o.validade||addDays(today(),7)}"></div><div><label>Status</label><select id="or_st">${opts(['Rascunho','Enviado','Aprovado','Reprovado','Expirado'],o.status)}</select></div></div><label>Observações</label><textarea id="or_o">${E(o.observacao)}</textarea><h3>Itens</h3><div id="ori"></div><div class="acts"><button onclick="addOrcItem()">Adicionar produto</button><button onclick="addOrcServ()">Adicionar serviço</button><b id="ort"></b></div><div class="acts"><button class="p" onclick="saveOrc(${id||0})">Salvar orçamento</button><button onclick="X()">Fechar</button></div>`);itemsOrc()}
function addOrcItem(){orcCur.push({tipo:'Produto',produto_id:S.prod[0]?.id||null,servico_id:null,descricao:'',q:1,v:0});itemsOrc()}
function addOrcServ(){orcCur.push({tipo:'Serviço',produto_id:null,servico_id:S.serv[0]?.id||null,descricao:'',q:1,v:0});itemsOrc()}
function itemsOrc(){$('ori').innerHTML=orcCur.map((i,k)=>{const lista=i.tipo=='Produto'?S.prod:S.serv;return `<div class="r"><select onchange="orcCur[${k}].tipo=this.value;orcCur[${k}].produto_id=null;orcCur[${k}].servico_id=null;itemsOrc()">${opts(['Produto','Serviço'],i.tipo)}</select><select onchange="${i.tipo=='Produto'?`orcCur[${k}].produto_id=+this.value;orcCur[${k}].v=+(S.prod.find(x=>x.id==+this.value)?.preco||0);sumOrc()`:`orcCur[${k}].servico_id=+this.value;orcCur[${k}].v=+(S.serv.find(x=>x.id==+this.value)?.preco||0);sumOrc()`}">${lista.map(p=>`<option value="${p.id}" ${p.id==(i.produto_id||i.servico_id)?'selected':''}>${E(p.nome)}</option>`).join('')}</select><input type="number" min="1" value="${i.q}" onchange="orcCur[${k}].q=+this.value;sumOrc()"><input type="number" step=".01" value="${i.v}" onchange="orcCur[${k}].v=+this.value;sumOrc()"><button onclick="orcCur.splice(${k},1);itemsOrc()">✕</button></div>`}).join('');sumOrc()}
const sumOrc=()=>{if($('ort'))$('ort').textContent='Total: '+R$(orcCur.reduce((a,i)=>a+(+i.q||0)*(+i.v||0),0))}
async function saveOrc(id){const cliente_id=+$('or_c').value;if(!cliente_id||!orcCur.length)return alert('Informe cliente e itens.');const total=orcCur.reduce((a,i)=>a+(+i.q||0)*(+i.v||0),0);let oid=id;if(id){if(!await run(db.from('orcamentos').update({cliente_id,data:$('or_d').value,validade:$('or_vd').value,status:$('or_st').value,observacao:$('or_o').value,total}).eq('id',id)))return;await db.from('orcamento_itens').delete().eq('orcamento_id',id)}else{const r=await db.from('orcamentos').insert({cliente_id,data:$('or_d').value,validade:$('or_vd').value,status:$('or_st').value,observacao:$('or_o').value,total}).select().single();if(r.error)return alert('Erro: '+r.error.message);oid=r.data.id}if(!await run(db.from('orcamento_itens').insert(orcCur.map(i=>({...i,orcamento_id:oid})))) )return;X();refresh()}
async function orcToOS(id){const o=S.orc.find(x=>x.id==id),it=S.oi.filter(i=>i.orcamento_id==id);const itens=it.map(i=>({t:i.tipo=='Produto'?'Peça':'Serviço',d:i.tipo=='Produto'?pn(i.produto_id):sn(i.servico_id),q:i.q,v:i.v}));const r=await db.from('os').insert({cliente_id:o.cliente_id,origem:'Orçamento #'+id,equip:'',problema:'Serviço originado do orçamento #'+id,itens,status:'Aberto'});if(r.error)alert('Erro: '+r.error.message);else{await db.from('orcamentos').update({status:'Aprovado'}).eq('id',id);refresh()}}
/* financeiro */
function fFin(){M(`<h3>Lançar conta</h3><label>Tipo</label><select id="f_t"><option value="P" ${filters.ft=='P'?'selected':''}>A pagar</option><option value="R" ${filters.ft=='R'?'selected':''}>A receber</option></select><label>Descrição</label><input id="f_d"><label>Cliente</label><select id="f_c"><option value="">Nenhum</option>${S.cli.map(c=>`<option value="${c.id}">${E(c.nome)}</option>`).join('')}</select><label>Valor</label><input id="f_v" type="number" step=".01"><label>Vencimento</label><input id="f_x" type="date" value="${today()}"><div class="acts"><button class="p" onclick="saveFin()">Salvar lançamento</button><button onclick="X()">Fechar</button></div>`)}
async function saveFin(){const r={tipo:$('f_t').value,descr:$('f_d').value.trim(),valor:+$('f_v').value,venc:$('f_x').value,cliente_id:+$('f_c').value||null,juros:0};if(!r.descr||!r.valor||!r.venc)return alert('Preencha descrição, valor e vencimento.');if(await run(db.from('fin').insert(r))){X();refresh()}}
function baixa(id){const x=S.fin.find(f=>f.id==id);M(`<h3>Dar baixa · ${E(x.descr)}</h3><label>Valor original</label><input value="${R$(x.valor)}" disabled><label>Juros recebidos (R$)</label><input id="b_j" type="number" step=".01" min="0" value="${x.juros||0}"><label>Forma de pagamento</label><select id="b_f">${opts(FP)}</select><label>Data</label><input id="b_d" type="date" value="${today()}"><div class="acts"><button class="p" onclick="doBaixa(${id})">Confirmar baixa</button><button onclick="X()">Fechar</button></div>`)}
async function doBaixa(id){const j=+$('b_j').value||0;if(await run(db.from('fin').update({pago:true,juros:j,forma:$('b_f').value,data_pag:$('b_d').value}).eq('id',id))){X();refresh()}}
/* recibos */
function fRecibo(id){const r=S.rec.find(x=>x.id==id)||{};M(`<h3>Novo recibo</h3><label>Cliente</label><input id="r_c" value="${E(r.cliente_nome)}"><label>Valor</label><input id="r_v" type="number" step=".01" value="${r.valor||0}"><label>Referente a</label><input id="r_ref" value="${E(r.referente)}"><label>Forma de pagamento</label><select id="r_f">${opts(FP,r.forma)}</select><label>Data</label><input id="r_d" type="date" value="${r.data||today()}"><label>Observação</label><textarea id="r_o">${E(r.observacao)}</textarea><div class="acts"><button class="p" onclick="saveRecibo()">Salvar recibo</button><button onclick="X()">Fechar</button></div>`)}
async function saveRecibo(){const r={cliente_nome:$('r_c').value.trim(),valor:+$('r_v').value||0,referente:$('r_ref').value,forma:$('r_f').value,data:$('r_d').value,observacao:$('r_o').value};if(!r.cliente_nome||!r.valor)return alert('Informe cliente e valor.');if(await run(db.from('recibos').insert(r))){X();refresh()}}
async function reciboFin(id){const x=S.fin.find(f=>f.id==id),c=cn(x.cliente_id);const r=await db.from('recibos').insert({cliente_nome:c,cliente_id:x.cliente_id,valor:(+x.valor||0)+(+x.juros||0),referente:x.descr,forma:x.forma,data:x.data_pag,observacao:x.juros?'Inclui juros de '+R$(x.juros):''}).select().single();if(r.error)alert('Erro: '+r.error.message);else{await load();pdfRecibo(r.data.id)}}
/* empresa */
function fEmpresa(){const e=S.emp||{};M(`<h3>Dados da minha empresa</h3><div class="g"><div><label>Razão social</label><input id="e_r" value="${E(e.razao_social)}"></div><div><label>Nome fantasia</label><input id="e_n" value="${E(e.nome_fantasia)}"></div><div><label>CNPJ</label><input id="e_c" value="${E(e.cnpj)}"></div><div><label>IE</label><input id="e_ie" value="${E(e.ie)}"></div><div><label>Telefone</label><input id="e_t" value="${E(e.telefone)}"></div><div><label>WhatsApp</label><input id="e_w" value="${E(e.whatsapp)}"></div><div><label>E-mail</label><input id="e_em" value="${E(e.email)}"></div><div><label>CEP</label><input id="e_cep" value="${E(e.cep)}"></div><div><label>Endereço</label><input id="e_end" value="${E(e.endereco)}"></div><div><label>Número</label><input id="e_num" value="${E(e.numero)}"></div><div><label>Bairro</label><input id="e_bai" value="${E(e.bairro)}"></div><div><label>Cidade</label><input id="e_cid" value="${E(e.cidade)}"></div><div><label>UF</label><input id="e_uf" maxlength="2" value="${E(e.uf)}"></div><div><label>Logo (URL)</label><input id="e_logo" value="${E(e.logo_url)}"></div></div><div class="acts"><button class="p" onclick="saveEmpresa()">Salvar empresa</button><button onclick="X()">Fechar</button></div>`)}
async function saveEmpresa(){const r={razao_social:$('e_r').value,nome_fantasia:$('e_n').value,cnpj:$('e_c').value,ie:$('e_ie').value,telefone:$('e_t').value,whatsapp:$('e_w').value,email:$('e_em').value,cep:$('e_cep').value,endereco:$('e_end').value,numero:$('e_num').value,bairro:$('e_bai').value,cidade:$('e_cid').value,uf:$('e_uf').value,logo_url:$('e_logo').value};const q=S.emp?db.from('empresa').update(r).eq('id',S.emp.id):db.from('empresa').insert(r);if(await run(q)){X();refresh()}}
/* admin */
function fUser(id){const p=S.per.find(x=>x.id==id)||{perms:{}};const modules=Object.keys(MODS).filter(x=>x!='dashboard');M(`<h3>${id?'Permissões de '+E(p.nome):'Novo usuário'}</h3><label>Nome</label><input id="u_n" value="${E(p.nome)}">${id?'':'<label>E-mail</label><input id="u_e" type="email"><label>Senha inicial</label><input id="u_p" type="text">'}<label><input type="checkbox" id="u_a" style="width:auto" ${p.admin?'checked':''}> Administrador (acesso total)</label><div class="tbl"><table><tr><th>Módulo</th><th>Ver</th><th>Editar</th><th>Excluir</th></tr>${modules.map(m=>`<tr><td>${MODS[m]}</td>${['v','e','x'].map(n=>`<td><input type="checkbox" style="width:auto" id="pm_${m}_${n}" ${p.perms?.[m]?.[n]?'checked':''}></td>`).join('')}</tr>`).join('')}</table></div><div class="acts"><button class="p" onclick="saveUser('${id}')">Salvar</button><button onclick="X()">Fechar</button></div>`)}
async function saveUser(id){const perms={};for(const m of Object.keys(MODS).filter(x=>x!='dashboard')){perms[m]={};for(const n of['v','e','x'])perms[m][n]=$(`pm_${m}_${n}`).checked}const r={nome:$('u_n').value.trim(),admin:$('u_a').checked,perms};if(!r.nome)return alert('Informe o nome.');if(id){if(await run(db.from('perfis').update(r).eq('id',id))){X();refresh()}return}const em=$('u_e').value.trim(),pw=$('u_p').value;if(!em||pw.length<6)return alert('Informe e-mail e senha com pelo menos 6 caracteres.');const c2=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const{data,error}=await c2.auth.signUp({email:em,password:pw});if(error||!data.user)return alert('Não foi possível criar o usuário: '+(error?.message||'tente novamente'));if(await run(db.from('perfis').insert({...r,id:data.user.id}))){X();refresh()}}
function fTec(id){const t=S.tec.find(x=>x.id==id)||{};M(`<h3>${id?'Editar técnico':'Novo técnico'}</h3><label>Nome</label><input id="t_n" value="${E(t.nome)}"><label>Usuário associado</label><select id="t_p"><option value="">Nenhum</option>${S.per.map(p=>`<option value="${p.id}" ${p.id==t.perfil_id?'selected':''}>${E(p.nome)}</option>`).join('')}</select><div class="acts"><button class="p" onclick="saveTec(${id||0})">Salvar</button><button onclick="X()">Fechar</button></div>`)}
async function saveTec(id){const r={nome:$('t_n').value.trim(),perfil_id:$('t_p').value||null};if(!r.nome)return alert('Informe o nome.');if(await run(id?db.from('tecnicos').update(r).eq('id',id):db.from('tecnicos').insert(r))){X();refresh()}}

/* PDFs */
const TERMOS=['Garantia de 90 dias sobre o serviço executado e as peças substituídas, contados da data de entrega.','A garantia não cobre mau uso, quedas, contato com líquidos, violação de lacres ou defeitos sem relação com o serviço realizado.','Se forem encontrados novos defeitos, um novo orçamento será apresentado e só será executado com a aprovação do cliente.','A empresa não se responsabiliza por perda de dados. O backup é de responsabilidade do cliente.','Após 90 dias do aviso de conclusão, poderá ser cobrada taxa de armazenagem do equipamento.'];
function ph(){const e=S.emp||{};return `<div class="ph">${e.logo_url?`<img src="${E(e.logo_url)}" alt="">`:''}<div><h1>${E(e.nome_fantasia||e.razao_social||'EMPRESA')}</h1><i>${E(e.cnpj||'')}</i><br>${E(e.whatsapp||e.telefone||'')} · ${E(e.email||'')}</div></div>`}
function pdfOS(id){const o=S.os.find(x=>x.id==id),c=S.cli.find(x=>x.id==o.cliente_id)||{};$('print').innerHTML=ph()+`<h2>Ordem de Serviço nº ${o.id}</h2><p>Data: ${D(o.criado)} · Status: ${E(o.status)}</p><p><b>Cliente:</b> ${E(c.nome)} ${E(c.telefone)}<br><b>Equipamento:</b> ${E(o.equip)} ${o.serie?'· Série '+E(o.serie):''}<br><b>Acessórios:</b> ${E(o.acess)}<br><b>Estado:</b> ${E(o.estado)}<br><b>Problema:</b> ${E(o.problema)}</p><table><tr><th>Tipo</th><th>Descrição</th><th>Qtd</th><th>Valor</th><th>Subtotal</th></tr>${(o.itens||[]).map(i=>`<tr><td>${E(i.t)}</td><td>${E(i.d)}</td><td>${i.q}</td><td>${R$(i.v)}</td><td>${R$(i.q*i.v)}</td></tr>`).join('')}</table><h3 style="color:#000">Total: ${R$(tot(o))}</h3><h4>Garantia e condições</h4><ol>${TERMOS.map(t=>`<li>${t}</li>`).join('')}</ol><p style="margin-top:36px">______________________________<br>Assinatura do cliente</p>`;print()}
function pdfOrc(id){const o=S.orc.find(x=>x.id==id),c=S.cli.find(x=>x.id==o.cliente_id)||{},it=S.oi.filter(x=>x.orcamento_id==id);$('print').innerHTML=ph()+`<h2>Orçamento nº ${o.id}</h2><p>Data: ${D(o.data)} · Validade: ${D(o.validade)} · Status: ${E(o.status)}</p><p><b>Cliente:</b> ${E(c.nome)}<br>${E(c.endereco)} ${E(c.numero)} · ${E(c.cidade)}/${E(c.uf)}<br>${E(c.telefone)} · ${E(c.email)}</p><table><tr><th>Tipo</th><th>Descrição</th><th>Qtd.</th><th>Valor</th><th>Subtotal</th></tr>${it.map(i=>`<tr><td>${E(i.tipo)}</td><td>${E(i.tipo=='Produto'?pn(i.produto_id):sn(i.servico_id))}</td><td>${i.q}</td><td>${R$(i.v)}</td><td>${R$(i.q*i.v)}</td></tr>`).join('')}</table><h3 style="color:#000">Total: ${R$(o.total)}</h3><p>${E(o.observacao)}</p><p style="margin-top:50px">______________________________<br>Assinatura / aprovação do cliente</p>`;print()}
function pdfRecibo(id){const r=S.rec.find(x=>x.id==id),e=S.emp||{};$('print').innerHTML=ph()+`<h2>RECIBO Nº ${r.id}</h2><p>Recebi de <b>${E(r.cliente_nome)}</b> a importância de <b>${R$(r.valor)}</b>.</p><p><b>Referente a:</b> ${E(r.referente)}<br><b>Forma de pagamento:</b> ${E(r.forma)}<br><b>Data:</b> ${D(r.data)}</p><p>${E(r.observacao)}</p><p style="margin-top:80px">______________________________<br>${E(e.nome_fantasia||e.razao_social||'Responsável')}</p>`;print()}
boot();
</script>
